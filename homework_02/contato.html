<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Contato</title>
</head>
<body>
  <header class="headerStyle">
    <div class="navContent">
      <div class="navImageBg">
        <img class="navImage" src="assets/alpha.jpg" alt="Imagem do Alpha">
      </div>
      <span class="navTitle">Alpha's group of friends</span>
      <nav class="">
        <ul class="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="sobre.html" target="_blank">Sobre</a></li>
          <li><a href="contato.html" target="_blank">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <h1 class="pageTitle">Contato</h1>
  <section class="formPos">
    <div>
      <form class="formContent">
        <label for="nome">Digite seu nome completo:</label> <br>
        <input type="text" name="" id="nome" placeholder="Nome completo"> <br>
        <label for="email">Digite seu e-mail:</label> <br>
        <input type="email" id="email" placeholder="E-mail"> <br>
        <label for="contato">Qual o motivo do contato?</label> <br>
        <select name="" id="contato">
          <option value="">Gosto mais de HTML</option>
          <option value="">Gosto mais de CSS</option>
          <option value="">Gosto mais de batata</option>
        </select><br>
        <label for="mensagem">Digite sua mensagem:</label>
        <textarea name="" id="mensagem" cols="30" rows="10" placeholder="Mensagem"></textarea><br>
        <button class="formButton">Enviar</button>
      </form>
    </div>
  </section>
  <footer class="footerStyle">
    <div class="footerContent">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sobre.html" target="_blank">Sobre</a></li>
        <li><a href="contato.html" target="_blank">Contato</a></li>
      </ul><br>
      <em>6 Chome-27-30 Shinjuku, Tokyo - Japão</em>
    </div>
  </footer>
</body>
</html>
